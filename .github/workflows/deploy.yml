name: Verify and deploy SeQontrol.com

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # deploy-pages v4 and later fetch the artifact by ID and need this.
  actions: read

# One deploy at a time. Queued runs wait rather than racing each other, but a run
# already in progress finishes, so a deploy is never half-applied.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The site is hand-written static HTML with no build step, so there is nothing
  # to compile — but there is plenty to get wrong. This job is the guard rail:
  # broken links, unbalanced tags, accessibility regressions, and the editorial
  # rules the site is committed to (no prices, no customer references, no CIS
  # framework names, no re-consent overclaim). See tools/verify.py.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, not the default shallow clone. build_seo.py derives each sitemap
          # <lastmod> from `git log -1` on that file; with depth 1 every page reports the HEAD
          # commit date instead, and the reproducibility check below would fail on a sitemap that
          # is not actually wrong.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify site
        run: python tools/verify.py

      # The rule this repository runs on is that the generators own the HTML — editing a generated
      # page by hand is how work gets silently overwritten. Nothing enforced it: verify.py checks
      # the SHAPE of whatever HTML is committed, never whether the generators would produce that
      # HTML. So the two most likely mistakes in this repo — hand-editing a generated page, and
      # changing a generator without re-running it — both passed CI and deployed, and stayed wrong
      # until a person happened to notice. Re-running the pipeline and diffing is the enforcement.
      #
      # build_images.py is deliberately not run here. It needs Pillow, and its output — the WebP
      # twins and the <picture> wrappers — is committed, so the diff stays clean without it. Anyone
      # changing a screenshot runs it locally; README says so.
      - name: Generators reproduce the committed HTML
        run: |
          python tools/build_legal.py
          python tools/build_guides.py
          python tools/build_licensing.py
          python tools/build_nav.py
          python tools/build_seo.py
          # sitemap.xml is excluded, and only sitemap.xml. Its <lastmod> values come from
          # `git log -1` per file, so they differ either side of a commit: generated locally they
          # carry the previous commit's date, regenerated here they carry this one. Those agree only
          # when both happen on the same day, so this check would flake across any midnight. The
          # sitemap is not left unchecked — verify.py's check_sitemap compares its URL set against
          # build_seo.META, which is the part that can actually drift.
          git diff --exit-code -- . ':!sitemap.xml'

  deploy:
    # Pull requests are verified but never published.
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # enablement: true turns Pages on for the repository if it is not already,
      # so a fresh clone of this repo deploys without anyone visiting Settings.
      # It cannot override the plan: Pages on a PRIVATE repo needs Pro/Team/
      # Enterprise, and on a free plan this fails with HTTP 422 until the
      # repository is made public.
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      # The repository root IS the site: no generated output directory, so the
      # whole checkout is uploaded. tools/ and .github/ ride along harmlessly —
      # they are a few KB and Pages will not execute them.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
          # Without this the deploy silently drops every dotfile, and the build still goes green.
          # v4 of this action began excluding hidden files by default; v5 added this input to turn
          # that back off. It cost this site both of the ones it has:
          #
          #   /.well-known/security.txt   404 — the exact path RFC 9116 names, so a researcher
          #                               looking for how to report a vulnerability found nothing.
          #                               There is no root-level copy to fall back to.
          #   /.nojekyll                  404 — so Pages was running Jekyll over the checkout,
          #                               which discards paths beginning with an underscore.
          #
          # Quoted deliberately. The action compares this input against the string 'true', and an
          # unquoted YAML boolean is one of the few things that reaches a composite action as
          # something other than the string you wrote.
          include-hidden-files: 'true'

      - id: deployment
        uses: actions/deploy-pages@v5

  # Everything above this point reads the repository. Nothing had ever read the deployed site, which
  # is how /.well-known/security.txt stayed a 404 from launch with every build green: the file was
  # present and valid in the source tree the whole time, so verify.py had nothing to complain about.
  #
  # This job is the only thing in the pipeline that can see the gap between what was committed and
  # what is served. It runs after the deploy, against the live origin, and fails the run if they
  # disagree — the deploy has already happened by then, so this reports rather than prevents, which
  # is the most that is available without a staging origin.
  smoke:
    needs: deploy
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check the live site serves what was built
        run: bash tools/smoke_test.sh https://seqontrol.com
